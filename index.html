<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CELPIP 词汇手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F0; --surface:#FFFFFF; --ink:#1B2A27; --muted:#5F716C; --line:#D3DCD8;
  --spruce:#235A4F; --spruce-soft:#DCEAE5; --hl:#F6DD47; --hl-ink:#1B2A27;
  --rule:#C9DAF0; --margin:#E58C8C; --bad:#B4412F; --ok:#2E7D52; --warn:#9A6A00;
  --serif:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111816; --surface:#19221F; --ink:#E4ECE9; --muted:#9AABA6; --line:#2C3A36;
    --spruce:#7CC2AF; --spruce-soft:#1F332D; --hl:#E2C53A; --hl-ink:#14110A;
    --rule:#26344A; --margin:#7A3A3A; --bad:#F08A76; --ok:#7FD3A2; --warn:#E3B54F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111816; --surface:#19221F; --ink:#E4ECE9; --muted:#9AABA6; --line:#2C3A36;
  --spruce:#7CC2AF; --spruce-soft:#1F332D; --hl:#E2C53A; --hl-ink:#14110A;
  --rule:#26344A; --margin:#7A3A3A; --bad:#F08A76; --ok:#7FD3A2; --warn:#E3B54F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
.en{font-family:var(--serif)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.brand{padding-bottom:12px}
.brand h1{margin:0;font:700 22px/1.1 var(--serif);letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav button{background:none;border:0;padding:10px 14px 12px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--spruce);font-weight:600}
.meter{display:none!important;padding-bottom:12px;font-size:13px;color:var(--muted);white-space:nowrap}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.acct img{width:24px;height:24px;border-radius:50%}
.acct .who{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.acct .dot.ok{background:var(--ok)}.acct .dot.busy{background:var(--warn)}.acct .dot.off{background:var(--bad)}
.acct button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.acct button.pri{background:var(--spruce);color:var(--paper);border-color:var(--spruce)}
.voices{display:flex;gap:12px;padding-bottom:10px;flex-wrap:wrap}
.voicesel{font-size:13px;color:var(--muted)}
.voicesel select{max-width:150px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
.dict{font-size:13px;color:var(--spruce);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;align-self:center}
.dict:hover{background:var(--spruce-soft)}
.meter b{color:var(--ink);font-family:var(--serif);font-size:16px}

main{max-width:1180px;margin:0 auto;padding:20px}
.view{display:none}.view.on{display:block}

/* browse */
.browse{display:grid;grid-template-columns:250px 1fr;gap:28px}
.themes{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}
.themes button{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px}
.themes button:hover{background:var(--spruce-soft)}
.themes button.on{background:var(--spruce);color:var(--paper)}
.themes button.on .cnt{color:var(--paper)}
.themes .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.themes .pbar{grid-column:2/4;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.themes .pbar i{display:block;height:100%;background:var(--hl)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.th-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 10px}
.th-head h2{margin:0;font:600 26px/1.2 var(--serif)}
.th-head span{color:var(--muted);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(130px,220px) 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--spruce-soft)}
.row .emo{font-size:22px;text-align:center}
.row .emo.fb0{opacity:.28;filter:grayscale(1);font-size:17px}
.row .w{font:600 17px/1.3 var(--serif)}
.row .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tags{display:flex;gap:6px;font-size:12px}
.tag{padding:1px 7px;border-radius:4px;background:var(--spruce-soft);color:var(--spruce)}
.mark{background:linear-gradient(104deg,transparent 0 2%,var(--hl) 3% 96%,transparent 98%);background-size:100% 62%;background-position:0 82%;background-repeat:no-repeat;color:var(--hl-ink);padding:0 3px;margin:0 -3px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.more{display:block;margin:14px auto 0}

/* detail dialog */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(640px,94vw);max-height:88vh;box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.dl{padding:26px 28px 22px;overflow:auto;max-height:88vh}
.dl .top{display:flex;align-items:flex-start;gap:14px}
.dl .big{font-size:46px;line-height:1}
.dl h3{margin:0;font:700 34px/1.15 var(--serif);word-break:break-word}
.dl .mean{font-size:18px;margin:6px 0 0}
.dl .close{margin-left:auto;background:none;border:0;font-size:22px;color:var(--muted);padding:2px 8px}
.say{background:var(--spruce-soft);border:0;color:var(--spruce);border-radius:999px;width:34px;height:34px;font-size:16px;flex:none}
.sec{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.sec p{margin:0}
.quote{font-family:var(--serif);font-size:16px;line-height:1.6}
.wlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wl{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 9px;font-family:var(--serif);font-size:15px}
.wl.ghost{border-style:dashed;color:var(--muted);cursor:default}
.wl.self{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.exl{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.55}
.exl .say{margin-top:1px}
.exl.sm{font-size:15px;line-height:24px;color:var(--ink)}
.say.mini{width:26px;height:26px;font-size:12px}
.ipa{display:inline-block;font-family:"Charis SIL","Doulos SIL","Lucida Grande","Segoe UI",system-ui,sans-serif;color:var(--muted);font-size:15px;margin-top:4px}
.mean{display:flex;flex-direction:column;gap:4px}
.mean .ps{display:block}
.row .m .ps{display:inline;margin-right:10px}
.pos{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--spruce);margin-right:6px}
.xz{color:var(--muted);font-size:14px;margin-top:3px;font-family:var(--sans)}
.srsline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
.btn.pri{background:var(--spruce);border-color:var(--spruce);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}

/* flashcards */
.deckbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.deckbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.deckstat{color:var(--muted);font-size:14px}
.stage{display:grid;place-items:center;min-height:420px}
.card{width:min(600px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 36px rgba(20,40,35,.10);padding:18px 26px 24px;cursor:pointer;outline-offset:4px}
.card .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.card .head{text-align:center;padding:30px 0 22px}
.card .ce{font-size:44px;line-height:1;margin-bottom:10px}
.card .cw{font-weight:700;font-size:clamp(34px,6.5vw,52px);line-height:1.1;word-break:break-word}
.card .sub{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;min-height:34px}
.card .backonly{display:none}
.card .tap{margin-top:18px;color:var(--muted);font-size:13px}
.card .back{display:none;border-top:1px solid var(--line);padding-top:18px;cursor:auto}
.card.flip .back{display:block;animation:rise .22s ease-out}
.card.flip .backonly{display:inline}
.card.flip .tap{display:none}
.card.flip .head{padding:18px 0 16px}
.card .mean{font-size:17px}
.exbox{margin-top:14px;background:var(--spruce-soft);border-radius:12px;padding:12px 14px}
.card .extra{margin:12px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.card .extra b{color:var(--ink);font-weight:600;margin-right:8px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{color:var(--muted);font-size:13px;margin-top:14px;text-align:center}
.rate{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.rate button{min-width:120px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.rate button small{display:block;color:var(--muted);font-size:12px}
.rate .r1{border-color:var(--bad)}.rate .r3{border-color:var(--ok)}
.rate .r0{border-style:dashed;min-width:200px;color:var(--muted)}
.rate+.rate{margin-top:10px}
.done{text-align:center;max-width:420px}
.done h2{font:600 26px var(--serif);margin:0 0 6px}

/* quiz */
.qbox{max-width:620px;margin:0 auto}
.qprog{height:4px;background:var(--line);border-radius:2px;margin-bottom:22px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--spruce);transition:width .3s}
.qq{text-align:center;margin-bottom:22px}
.qq .w{font:700 38px/1.2 var(--serif)}
.qq .zh{font-size:22px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.opt:hover:not(:disabled){border-color:var(--spruce)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.spell{display:flex;gap:8px}.spell input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:20px var(--serif)}
.fb{min-height:50px;margin-top:14px;text-align:center}
.fb .ok{color:var(--ok)}.fb .no{color:var(--bad)}

/* links */
.subnav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.groups{columns:2 340px;column-gap:20px}
.grp{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.grp h3{margin:0 0 4px;font-size:16px}
.grp h3 .r{font:600 18px var(--serif);margin-right:8px}
.grp p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.intro{color:var(--muted);max-width:70ch;margin:0 0 16px}

/* essays */
.essay{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.essay summary{padding:12px 16px;cursor:pointer;font-weight:600;display:flex;gap:10px;justify-content:space-between}
.essay summary span{color:var(--muted);font-weight:400;font-size:13px}
.essay .tx{padding:0 20px 18px;font:16px/1.75 var(--serif);white-space:pre-wrap;max-width:75ch}
.essay .tx button{all:unset;cursor:pointer;background:var(--hl);color:var(--hl-ink);padding:0 2px;border-radius:2px}
.essay .tx button:focus-visible{outline:2px solid var(--spruce)}

/* progress */
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pt .h{display:flex;justify-content:space-between;font-size:14px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:8px}
.stack i:nth-child(1){background:var(--hl)}.stack i:nth-child(2){background:var(--spruce)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.totals{display:flex;gap:32px;margin-bottom:20px;flex-wrap:wrap}
.totals div{font-size:13px;color:var(--muted)}.totals b{display:block;font:700 30px var(--serif);color:var(--ink)}
.danger{color:var(--bad)}

@media (max-width:760px){
  .acct .st,.acct .who{display:none}
  .brand{padding-bottom:4px}
  nav{order:3;flex-basis:100%}
  .voices{order:2;padding-bottom:4px}
  .voices{flex-wrap:nowrap}
  .voicesel select{max-width:32vw}
  .browse{grid-template-columns:1fr}
  .themes{position:static;max-height:none;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
  .themes button{width:auto;white-space:nowrap;display:flex;flex:none;border:1px solid var(--line)}
  .themes .pbar{display:none}
  .row{grid-template-columns:32px 1fr auto;gap:8px}
  .row .m{grid-column:2/4;white-space:normal}
  .row .tags{grid-row:1;grid-column:3}
  .meter{display:none}
}
@media (prefers-reduced-motion:reduce){.card.flip .back{animation:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1>CELPIP 词汇手册</h1><p id="sub"></p></div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-v="browse" aria-selected="true">场景分类</button>
      <button role="tab" data-v="cards">闪卡复习</button>
      <button role="tab" data-v="quiz">小测</button>
      <button role="tab" data-v="links">关联记忆</button>
      <button role="tab" data-v="essays">写作范文</button>
      <button role="tab" data-v="progress">进度</button>
    </nav>
    <div class="meter">已掌握 <b id="mcount">0</b> / <span id="tcount"></span></div>
    <div class="voices"><div class="acct" id="acct" hidden></div><label class="voicesel">单词 <select id="srcSel" aria-label="单词发音来源"><option value="real">真人美音（联网）</option><option value="tts">电脑语音</option></select></label>
    <label class="voicesel">例句 <select id="voiceSel" aria-label="例句朗读语音"></select></label></div>
  </div>
</header>

<main>
  <section class="view on" id="v-browse">
    <div class="browse">
      <aside class="themes" id="themeList"></aside>
      <div>
        <div class="th-head"><h2 id="thTitle"></h2><span id="thCount"></span></div>
        <div class="tools">
          <input type="search" id="q" placeholder="搜索英文或中文，比如 adapt 或 适应">
          <button class="chip" data-f="all" aria-pressed="true">全部</button>
          <button class="chip" data-f="todo" aria-pressed="false">没掌握的</button>
          <button class="chip" data-f="ex" aria-pressed="false">范文里出现过</button>
                    <button class="btn pri" id="studyTheme">背这一类</button>
        </div>
        <div class="list" id="list"></div>
        <button class="btn more" id="more" hidden>显示更多</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-cards">
    <div class="deckbar">
      <select id="deckTheme" aria-label="选择词库"></select>
      <select id="deckSize" aria-label="每轮新词数量">
        <option value="20">每轮 20 个新词</option><option value="40" selected>每轮 40 个新词</option><option value="60">每轮 60 个新词</option><option value="100">每轮 100 个新词</option>
      </select>
      <button class="btn pri" id="deckStart">开始</button>
      <span class="deckstat" id="deckStat"></span>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <section class="view" id="v-quiz">
    <div class="deckbar">
      <select id="quizTheme" aria-label="测验范围"></select>
      <select id="quizType" aria-label="题型">
        <option value="en">看英文选中文</option><option value="zh">看中文选英文</option><option value="spell">听发音拼单词</option>
      </select>
      <button class="btn pri" id="quizStart">出 10 道题</button>
    </div>
    <div class="qbox" id="qbox"><p class="intro">选一个范围和题型开始。干扰项从同一类词里抽，会比随机更难一点。答错的词会自动放回闪卡的“明天再背”。</p></div>
  </section>

  <section class="view" id="v-links">
    <div class="subnav">
      <button class="chip" data-l="groups" aria-pressed="true">同义词团</button>
      <button class="chip" data-l="confuse" aria-pressed="false">易混词</button>
      <button class="chip" data-l="roots" aria-pressed="false">词根家族</button>
    </div>
    <div id="linkBody"></div>
  </section>

  <section class="view" id="v-essays">
    <p class="intro">CELPIP 写作范文，黄色标出的是本手册里的词。在完整的文章里看单词怎么用，比孤立地背更牢。点一下可以看释义。</p>
    <div id="essayBody"></div>
  </section>

  <section class="view" id="v-progress">
    <div class="totals" id="totals"></div>
    <div class="legend"><span><i style="background:var(--hl)"></i>已掌握（连续答对 3 次，或标成“早就会了”）</span><span><i style="background:var(--spruce)"></i>学习中</span><span><i style="background:var(--line)"></i>还没背</span></div>
    <div class="prog" id="progGrid"></div>
    <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="exportBtn">导出进度</button>
      <label class="btn">导入进度<input type="file" id="importFile" accept=".json" hidden></label>
      <button class="btn danger" id="resetBtn">清空进度</button>
    </div>
    <p class="intro" style="margin-top:12px" id="syncNote">登录 Google 账号后，进度会自动保存到云端，电脑和手机同步。没登录时，进度只保存在这个浏览器里。</p>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"><div class="dl" id="dlBody"></div></dialog>

<script>

rsity", "controversial", "irreversible", "various", "diverge"]], ["spect", "看", ["aspect", "perspective", "spectator", "spectacular", "specimen", "speculate"]], ["ven / vent", "来", ["advent", "intervene", "venue", "convention", "avenue"]], ["dict", "说", ["dictate", "verdict", "jurisdiction"]], ["cede / cess", "走", ["concede", "precedent", "predecessor", "successor", "excess"]], ["cept / ceive", "拿、接受", ["receptive", "reception", "perceive", "susceptible"]], ["flu / flux", "流", ["affluent", "influx", "influence", "fluctuate"]], ["rupt", "断裂", ["disrupt", "erupt"]], ["pel / puls", "推", ["compel", "propulsion"]], ["pon / pos / pound", "放", ["opponent", "proponent", "propose", "posit", "disposal", "disposable", "expose", "expound", "compost", "possession"]], ["sens / sent", "感觉", ["consensus", "dissenter", "sentimental", "sensible", "resent"]], ["viv / vit", "生命", ["vivid", "revive", "vital", "revitalize"]], ["gen", "产生、种族", ["genius", "genuine", "indigenous", "anthropogenic", "homogenous", "generics"]], ["cide", "杀", ["homicide", "insecticide"]], ["graph", "写、记录", ["demographic", "demographer", "geographical", "geographer", "cartograph"]], ["demo", "人民", ["democratic", "demographic", "demagogue", "epidemic", "demographer"]], ["logy / logist", "学科、学者", ["analogy", "gerontology", "sociologist", "psychologist", "biologist", "archaeologist", "ethnologist"]], ["anthrop", "人", ["anthropogenic", "philanthropic"]], ["mar / mari", "海", ["maritime", "submarine"]], ["hab / habit", "居住", ["inhabitable", "uninhabited"]], ["uni / un(a)", "一", ["uniform", "union", "unity", "unanimous"]], ["equ", "相等", ["adequate", "inadequate", "equitable"]], ["struct", "建造", ["obstruct"]], ["duct", "引导", ["conduct", "deduct", "misconduct"]], ["mit / mis", "送", ["commit", "admit", "emission", "committee", "commission", "compromise"]], ["serv", "保存", ["conservation", "preserve"]], ["cred", "相信", ["credibility"]], ["nov", "新", ["renovate", "renovation", "novice", "novel"]], ["circum", "环绕", ["circumnavigate"]], ["inter", "之间", ["interfere", "intervene", "intermediary", "interpret"]], ["sub", "在下", ["submarine", "subside", "substance", "substitute", "subsequent", "suburb", "susceptible"]], ["pre", "之前", ["precedent", "predecessor", "prerequisite", "precaution", "presume", "prescribe", "preserve", "premier"]], ["pro", "向前", ["proponent", "propulsion", "propose", "promote", "prompt", "prominent", "propaganda", "proactive"]], ["ex / e", "向外", ["exhaust", "excavation", "exorbitant", "expedition", "excursion", "expansion", "emission", "erupt", "expose", "expound", "exclusivity", "exterior"]], ["dis / di", "分开、否定", ["disrupt", "divert", "diverge", "dissenter", "distinguish", "disposal", "dismay", "distress", "diminish", "discriminate"]], ["re", "再、回", ["revive", "revitalize", "renovate", "reimburse", "reinforce", "revise", "resound", "reassure", "retrogressive", "revolve"]], ["com / con", "共同、加强", ["consensus", "commensurate", "comply", "compel", "consolidate", "correlate", "contagion", "collude", "companion", "communal"]]], "essays": [{"title": "You have registered for a six-month computer training program at Sambro Community College. You want to rent a room from Sambro Housing Agency.", "prompt": "You have registered for a six-month computer training program at Sambro Community College. You want to rent a room from Sambro Housing Agency.\n\nExplain when you need to rent the room.\nDescribe your requirements for the room.\nAsk about costs and the application process.", "text": "Dear Sir or Madam,\n\nI hope this email finds you well. I am writing to inquire renting a room through your agency, as I will be attending a six-month computer training progrram at Sambro Community College. I would need the room starting from September 1st since my program begins on September 5th.\n\nIdeally, I would prefer a single room with a private bathroom. It would be ideal if the room is within walking distance to the college or close to public transportation. Since I will need to study in the evenings, a quite environment with a reliable internet connection is particularly importance to me.\n\nCould you please let me know the monthly rental cost and whether utilities, such as electricity, heating, and water, are included? I would also like to know if a security deposit or any additional fees are required. Futhermore, could you please explain the application process and what documents I need to privide.\n\nThank you for your time and assistance. I look forward to hearing from you.\n\nBest regards,\nEric Jiang"}, {"title": "Last weekend you attended the Canada Day community picnic. The event was a potluck, so everyone brought a dish of food to share. Some people, including you, have allergies or can't eat some types of food, such as nuts and seafood, so you included a list of ingredients with your dish. No one else did this.", "prompt": "Last weekend you attended the Canada Day community picnic. The event was a potluck, so everyone brought a dish of food to share. Some people, including you, have allergies or can't eat some types of food, such as nuts and seafood, so you included a list of ingredients with your dish. No one else did this.\n\nExpress your overall enjoyment of last week's event.\nExplain why each potluck dish needs a list of ingredients.\nDescribe how the potluck could be differently organized next year.", "text": "Dear Organizer,\n\nI hope this email finds you well. I am writing to express my sincere thanks for last weekend's Canada Day community picnic. I had a wonderful time meeting neightbours and enjoying diverse dished.\n\nHowever, I would like to suggest an improvement for future potlucks if any. As someone, including me, with food allergies, I appreciated being able to include a list of ingredients with my dish. Unfortunately, no one else did this. Listing ingredients is essential for people with alleriges to avoid potential health risks. A simple card listing ingredients would help everyone feel included and safe.\n\nFor next year, I recommend implementing a more organized system. Maybe you could provide a sign-up sheet where participants could indicate what they will bring and list the ingredients. What's more, you could also organize dishes by category, such as appetizers, main courses, and desserts, to ensure a balanced meal.\n\nThank you for organizing such a wonderful event. I look forward to next year's Canada Day.\n\nBest regards,\nEric Jiang"}, {"title": "Construction Safety Concern", "prompt": "Construction Safety Concern\nYou live across from an elementary school where a construction team is working outside. You notice that the construction site does not have a safety fence around it and that it is too noisy during class. You are worried about children getting hurt after school or having difficulty learning in class.\n\nDescribe what you have seen\nExplain why you are worried\nSuggest how they could work more safely", "text": "Dear Construction Manager,\n\nI hope this email finds you well. I am writing this email to express my concern about the construction work taking place directly across from the elmentary school in our neighbourhood.\n\nOver the past few days, I have noticed that the construction site has no safety fence or warning signs to prevent children from entering the area. In addition, the workers have been using heavy machines throughout the school day, creating excessive noise that can be heard inside the room.\n\nI am particularly worried about the safety of young students. Since many children walk through the construction site after school, they could easily enter the area out of curiosity and get injured by construction equipment. Futhermore, the constant noise may distract students and make it difficult for them to focus on the class.\n\nI strongly recommend installing secure temporary fence and clear warning sign around the entire site. It would also be helpful to schedule noisy activities outside school hours whenever possible.\n\nThank you for your time and assistance. I look forward to hearing from you.\n\nBest regards,\nEric Jiang"}, {"title": "Recommending a Book", "prompt": "Recommending a Book\nYour co-worker is looking for a good book to read. He has asked you to recommend a book to him because you are known as someone who likes to read.\n\nBriefly describe the book you are recommending\nExplain why you recommend this book\nInvite your co-worker to ask questions about the book", "text": "Dear David,\n\nI hope this email finds you well. I heard that you are looking for an interesting book and I would highly recommend White Fang written by Jack London.\n\nIt's a famous and classic book. It tells a adventure story about a wolf-dog named White Fang, who grows up in the wilderness of the Yukon and gradually learns to live among humans. The story follows his journey from a wild animal to a loyal companion.\n\nOne of the main reason I recommend this book is that it offers valuable lessons about trust, kindness and the relationship between humans and animals. I particularly enjoyed how the author describe White Fang's struggles and transformations. Since you also have a dog, I believe you would find it especially enjoyable to read it.\n\nI would be happy to lend you my copy if you would like to read. If you have any questions about the story, please feel free to let me know. I would be glad to share my thoughts with you.\n\nBest regards,\nEric Jiang"}, {"title": "You live in a house near a park. Recently, a lot of teenagers have been meeting in the park at night. They are very noisy.", "prompt": "You live in a house near a park. Recently, a lot of teenagers have been meeting in the park at night. They are very noisy.\n\nProvide information about where you live.\nExplain the problem and how it affects your life.\nSuggest a way to solve the problem.", "text": "Dear Sir or Madam,\n\nI hope this email finds you well. I am writing to express my concerns about the noise caused by several teenagers who frequently gather in the park near my house at night.\n\nI live on Badgeley Avenue, with a public park located right behind my house. I moved here two years ago, when it was still a quiet and peaceful community.\n\nHowever, recently, many teenagers have been gathering in the park and having parties at night. These gatherings usually start at around 8 p.m. and continue until 11 p.m. They often play loud music and sing late into the night, creating considerable noise around the surrounding buildings. In addition, a large amount of garbage is often left behind, making the park dirty and unpleasant. As a result, many residents feel frustrated because they can no longer enjoy a quiet evening or get enough sleep.\n\nI would suggest that the local government introduce quiet hours in the park and increase evening patrols to prevent excessive noise. It would also be helpful to install more garbage bins and remind visitors to clean up after themselves.\n\nI would appreciate it if you could look into this matter and take appropriate action as soon as possible.\n\nBest regards,\nEric Jiang"}, {"title": "Work-from-Home Survey", "prompt": "Work-from-Home Survey\n\nYour company wants to allow some employees to work from home. Not everyone can have this choice because some jobs must be done at the office. The company wants to know if this is fair by surveying your opinion about working from home.\n\nOption A: A work-from-home choice is fair.\nOption B: A work-from-home choice is not fair.", "text": "There are advantages and disadvantages of both options, and it is understandable that some people treat work-from-home choice as unfair.\n\nGenerally speaking, however, I believe that allowing some employees to work from home is a fair decision. In my opinion, fairness does not necessarily mean that everyone must receive exactly the same benefits.\n\nFirst of all, different jobs have different requirements. For example, employees who work in customer service or manage office equipment may need to physically present at the workplace. However, employees who mainly work on computers can often complete their tasks just as effectively from home. Therefore, the company should consider the nature of each postion rather than apply the same working arrangement to everyone.\n\nOn the other hand, working from home can improve employees' productivity and work-life banlance. It allows them to save commuting time, reduce transportation expenses, and spend more time with their familiese. For employees who cannot work remotely, the company could offer other benefits, such as flexible schedules, additional paid leave, or transportation allowances.\n\nIn conclusion, I strongly support offering work-from-home opportunities to eligible employees. As long as the company provides reasonable alternative to those who must work on-site, this policy can be both practical and fair.\n\nThanks for considering my perspective."}, {"title": "Online vs. Print News Survey", "prompt": "Online vs. Print News Survey\nYour local newspaper is experiencing low sales of its newspapers since many readers are now choosing the online version. Its current number of online subscribers is now three times the number of print subscribers. The newspaper has sent a survey to all of its print and online subscribers to see whether there is enough demand to keep the print version.\n\nOption A: Stop producing the print version of the newspaper.\nOption B: Keep producing both the print and online versions.", "text": "Thank you for the opportunity to share my opinion on this matter. Generally speaking, I strongly support Option B for the following reasons.\n\nFirstly, the print versions are esstential for certain loyal readers, particularly senior residents and those without reliable internet access. Take my grandfather as an example, he is not able to get used to computer or smart phone. Reading the print newspaper has become one main part of his daily life.\n\nSecondly, the print newspaper plays more roles than expected. It usually servers as valuable educational tools in scools and community centers, where digital devices may not always be available.\n\nWhat's more, maintaining both formats allows the newspaper to server different groups and avoid losing subscribers. It can also help local business advertise in the format that suits variety of customers.\n\nIn conclusion, hybrid mode benifits readers, local businesses and communities. It's necessary to keep producing both the print and online versions.\n\nThanks for considering my perspective."}, {"title": "New Airport Survey", "prompt": "New Airport Survey\nThe city council is considering two empty sites as possible places to build a new airport. All residents are being asked to complete an opinion survey. One is in the downtown area and the other is 10 km away from the city centre.\n\nOption A: I think the airport should be built in the downtown area.\nOption B: I think the airport should be built far from the downtown area.", "text": "Thank you for the opportunity to share my opinion on this matter. Generally speaking, I strongly support Option B for the following reasons.\n\nFirst of all, airports generate considerable noise pollution due to aircraft taking off and landing throughout the day and night. If the airport is located downtown, nearby residents would constantly be disturbed by the loud aircraft noise, which could negatively affect their sleep and quality of life. Building it 10 kilometers away would help minimize this problem and provide a more peaceful living environment. \n\nSecondly, placing airport outside the city centre would help reduce traffic congestion. Airports attract large numbers of passengers, taxies and delivery vehicles every day. If the airport is located downtown, these additional vehicles could make existing traffic problems even worse. In contrast, an airport outside the city could be connected to the city through dedicated shuttle buses and improve public transportation.\n\nIn conclusion, I believe that building the airport away from downtown would be a better long-term decision. It would protect residents' quality of life while allowing the city to develop its transportation infrastructure more effectively.\n\nThank you for considering my perspective."}, {"title": "New Apartments Survey", "prompt": "New Apartments Survey\nYour local government is planning to build new apartment buildings near the city centre and is considering two options. One option is several apartment buildings with four floors each. The other option is one apartment building with 25 floors. The government office is conducting a survey among residents to learn their opinion.\n\nOption A: I prefer several apartment buildings with four floors each.\nOption B: I prefer one apartment building with 25 floors.", "text": "Thank you for the opportunity to share my opinion on this matter. Generally speaking, I strongly support several apartment buildings with four floors each.\n\nFirst of all, shorter buildings can provide residents with a more comfortable and pleasant atmosphere. High-rise buildings often create a crowded environment, with many people sharing elevators, hallways and other common facilities. In contrast, smaller apartment buildings usually have fewer residents, which can offer greater privacy and reduce waiting times for shared facilities.\n\nSecondly, several low-rise buildings can help distribute traffic and daily activities more evenly throughout the neighbourhood. If hundreds of residents live in one high-rise building, the surrounding roads, parking areas and public facilities may become overcrowded. By spreading residents across several buildings, the government can reduce pressure on local infrastructure and create a more balanced community.\n\nIn conclusion, I believe that several apartment buildings with four floors can provide a more comfortable living environment and a better neighbourhood than one building with 25 floors.\n\nThank you for considering my perspective."}, {"title": "Field Trip Transportation", "prompt": "Field Trip Transportation\nYour children's grade 5 class teacher likes to take the children on field trips to museums or parks. Sometimes the teacher takes the children on public buses. Some parents are unhappy. They say the school should always use school buses even though it is more expensive. You have been asked to respond to an opinion survey.\n\nOption A: Public Transit: I think it's okay for children to travel on public transit.\nOption B: School Buses: I would prefer children only travel on school buses.", "text": "Thank you for the opportunity to share my opinion on this matter. I strongly support the idea that school should use school buses for field trips rather than public transit.  \n\nFirst of all, school buses can provide a safety and more comfortable way for children to travel than public transit. Safety is always the top priority for children, especially on field trips. School buses are also equipped with various safety features to protect young passengers. Furthermore, school bus the drivers are usually more experienced in transporting children, helping ensure a safe and pleasant journey.  \n\nSecondly, public transit may cause unexpected delays and inconvenience. It's not uncommon for public buses be deplayed. Even if they arrive on time, there may not be enough seats for all the children. As a result, the teachers may have to divide the students into several smaller groups, which means that additional teachers or volunteers are needed.  \n\nIn conclusion, I believe that school buses are a better choice for field trips. They make it easier for teachers to organize activities while ensuring that children are well protected.  \n\nThank you for considering my perspective."}]};

const DAY=864e5, IV=[0,1,2,4,7,10,14];
const KEY='celpip7-vocab-srs-v1';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
// 旧版进度里用的是原表拼写，迁移到更正后的拼写
W.forEach(w=>{ if(w.old&&S[w.old]){ if(!S[w.w])S[w.w]=S[w.old]; delete S[w.old]; try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} } });
const MKEY='celpip-vocab-meta';
let META={r:0,owner:null}; try{META=Object.assign(META,JSON.parse(localStorage.getItem(MKEY)||'{}'))}catch(e){}
for(const k in S){ if(S[k]&&typeof S[k]==='object'&&!S[k].u) S[k].u=1; }
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(MKEY,JSON.stringify(META))}catch(e){}};
const save=()=>{persist(); refreshMeter(); window.__sync&&window.__sync.schedule();};
const st = w=>{const s=S[w.w]; return s&&!s.x?s:undefined;};
const known = w=>!!st(w)?.k;
const mastered = w=>known(w)||(st(w)?.b||0)>=3;
const learning = w=>st(w)&&!mastered(w);
const due = w=>st(w)&&!st(w).k&&st(w).d<=Date.now();
function markKnown(w){S[w.w]={b:IV.length-1,d:Date.now()+365*DAY,n:(st(w)?.n||0)+1,k:1,u:Date.now()};save();}
function unmark(w){S[w.w]={x:1,u:Date.now()};save();}
function rate(w,r){ // r: 1 不认识, 2 模糊, 3 认识
  const s=st(w)?{...st(w)}:{b:0,d:0,n:0}; delete s.k; s.u=Date.now();
  s.n++;
  if(r===1){s.b=0;s.d=Date.now()+10*6e4;}
  else if(r===2){s.b=Math.max(1,s.b);s.d=Date.now()+IV[s.b]*DAY*.5;}
  else {s.b=Math.min(s.b+1,IV.length-1);s.d=Date.now()+IV[s.b]*DAY;}
  S[w.w]=s; save();
}
function refreshMeter(){ const m=W.filter(mastered).length; $('#mcount').textContent=m; const s=$('#sub'); if(s)s.textContent=`${W.length} 个词，已掌握 ${m} 个`; }

const VKEY='celpip7-voice';
const accent=l=>/CA/i.test(l)?'加拿大':/US/i.test(l)?'美音':/GB|UK/i.test(l)?'英音':/AU/i.test(l)?'澳洲':/IN/i.test(l)?'印度':/IE/i.test(l)?'爱尔兰':l;
function pickVoice(){
  const all=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
  let saved=null; try{saved=localStorage.getItem(VKEY)}catch(e){}
  voice=all.find(x=>x.name===saved)||all.find(x=>/en-CA/i.test(x.lang))||all.find(x=>/en-US/i.test(x.lang)&&/natural|online|google|samantha|aria|jenny/i.test(x.name))||all.find(x=>/en-US/i.test(x.lang))||all[0]||null;
  const sel=$('#voiceSel'); if(!sel)return;
  const order=l=>/CA/i.test(l)?0:/US/i.test(l)?1:/GB/i.test(l)?2:3;
  sel.innerHTML=all.length?all.sort((a,b)=>order(a.lang)-order(b.lang)||a.name.localeCompare(b.name)).map(x=>`<option value="${esc(x.name)}"${x===voice?' selected':''}>${accent(x.lang)}：${esc(x.name.replace(/^(Microsoft|Google)\s*/,'').replace(/\s*-\s*English.*$/,'').replace(/\s*\((?:English\b|en-)[^)]*\)/i,'').replace('(Premium)','（高品质）').replace('(Enhanced)','（增强）'))}</option>`).join(''):'<option>没有可用的英语语音</option>';
}

const SKEY='celpip7-src';
let SRC='real'; try{SRC=localStorage.getItem(SKEY)||'real'}catch(e){}
const SPELL={};
const OKSRC={}; // 记住每个词哪一个来源能播
let toastT;
function toast(m){const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1600);}
function realSources(term){
  const w=(SPELL[term]||term).toLowerCase().trim(), out=[];
  if(/^[a-z]+$/.test(w)){
    const p=(s,n)=>s.slice(0,n).padEnd(n,'_');
    out.push(['剑桥词典',`https://dictionary.cambridge.org/media/english/us_pron/${w[0]}/${p(w,3)}/${p(w,5)}/${w}.mp3`]);
    out.push(['牛津词典',`https://ssl.gstatic.com/dictionary/static/sounds/oxford/${w}--_us_1.mp3`]);
  }
  out.push(['有道词典',`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w)}&type=2`]);
  return out;
}
const player=new Audio(); let playId=0;
function playReal(term){
  const id=++playId; let list=realSources(term);
  const k=OKSRC[term]; if(k!=null) list=[list[k]].concat(list.filter((_,i)=>i!==k));
  const all=realSources(term);
  const next=i=>{
    if(id!==playId)return;
    if(i>=list.length){toast('词典发音没取到，改用电脑语音'); return ttsSay(term);}
    let done=false; const fail=()=>{if(done)return; done=true; next(i+1);};
    const tm=setTimeout(fail,3500);
    player.oncanplay=null; player.onerror=()=>{clearTimeout(tm);fail();};
    player.src=list[i][1];
    player.play().then(()=>{clearTimeout(tm); if(done)return; done=true; OKSRC[term]=all.findIndex(s=>s[1]===list[i][1]); toast('发音来源：'+list[i][0]+'（美音）');}).catch(()=>{clearTimeout(tm);fail();});
  };
  next(0);
}
function say(t){
  const isTerm=t.length<=40&&!/[.?!,;]$/.test(t.trim())&&!/[.?!]\s/.test(t);
  if(isTerm&&SRC==='real'&&navigator.onLine!==false){ if('speechSynthesis' in window)speechSynthesis.cancel(); return playReal(t); }
  player.pause(); ttsSay(t);
}
document.addEventListener('change',e=>{if(e.target.id==='srcSel'){SRC=e.target.value; try{localStorage.setItem(SKEY,SRC)}catch(_){} say('confer');}});
function ttsSay(t){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.lang=voice?.lang||'en-US'; u.rate=t.length>30?.85:.9; speechSynthesis.speak(u); }
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]'); if(b){e.stopPropagation();say(b.dataset.say);}});

function posHTML(w,compact){ return (w.pos||[]).map(p=>`<span class="ps"><i class="pos">${esc(p[0])}</i>${esc(p[1])}</span>`).join(compact?' ':''); }
const shortM=w=>((w.pos&&w.pos[0]&&w.pos[0][1])||'').split('；')[0].slice(0,40);

function exHTML(w){ if(!w.xs)return ''; const [a,b]=w.xh||[0,0]; return esc(w.xs.slice(0,a))+'<span class="mark">'+esc(w.xs.slice(a,b))+'</span>'+esc(w.xs.slice(b)); }

function wlink(name,self){ const w=BY[name]; if(!w)return `<span class="wl ghost">${esc(name)}</span>`; return `<button class="wl${name===self?' self':''}" data-open="${w.i}">${esc(name)}</button>`; }
function hiSent(s,f){ const re=new RegExp('(^|[^A-Za-z])('+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i'); return esc(s).replace(re,'$1<span class="mark">$2</span>'); }
function openWord(w){
  const s=st(w), rel=REL[w.w]||{g:[],c:[],r:[]};
  let h=`<div class="top"><span class="big" aria-hidden="true">${w.e||THEMES[w.t][0]}</span><div style="min-width:0"><h3 class="en">${mastered(w)?`<span class="mark">${esc(w.w)}</span>`:esc(w.w)}</h3>${ipaHTML(w)}<div class="mean">${posHTML(w)}</div></div>
    <button class="say" data-say="${esc(w.w)}" aria-label="朗读 ${esc(w.w)}" style="margin-top:6px">🔊</button><button class="close" aria-label="关闭" id="dlClose">✕</button></div>`;
  h+=`<div class="srsline" style="margin-top:10px"><span class="tag">${THEMES[w.t][0]} ${THEMES[w.t][1]}</span></div>`;
  if(w.xs)h+=`<div class="sec"><h4>例句</h4>${exLine(w)}</div>`;
  if(w.n)h+=`<div class="sec"><h4>备注</h4><p>${esc(w.n)}</p></div>`;
  if(w.mn)h+=`<div class="sec"><h4>联想记忆</h4><p>${esc(w.mn)}</p></div>`;
  if(w.ex)h+=`<div class="sec"><h4>写作范文中的用法</h4>${w.ex.map(x=>`<p class="quote">${hiSent(x.s,x.f)}<br><small style="color:var(--muted);font-family:var(--sans)">——${esc(DATA.essays[x.e].title)}</small></p>`).join('<br>')}</div>`;
  rel.g.forEach(i=>{const g=DATA.groups[i]; h+=`<div class="sec"><h4>同义词团：${esc(g[0])}</h4><div class="wlinks">${g[1].map(n=>wlink(n,w.w)).join('')}</div>${g[2]?`<p style="margin-top:6px;font-size:14px;color:var(--muted)">${esc(g[2])}</p>`:''}</div>`;});
  rel.c.forEach(i=>{const c=DATA.confuse[i]; h+=`<div class="sec"><h4>别搞混</h4><div class="wlinks">${c[0].map(n=>wlink(n,w.w)).join('')}</div><p style="margin-top:6px;font-size:14px">${esc(c[1])}</p></div>`;});
  rel.r.forEach(i=>{const r=DATA.roots[i]; h+=`<div class="sec"><h4>词根 ${esc(r[0])}（${esc(r[1])}）</h4><div class="wlinks">${r[2].map(n=>wlink(n,w.w)).join('')}</div></div>`;});
  const stTxt=!s?'还没开始背':known(w)?'已标记为“早就会了”，不会出现在闪卡里':mastered(w)?`已掌握，下次复习：${new Date(s.d).toLocaleDateString()}`:`学习中（第 ${s.b} 级），下次复习：${new Date(s.d).toLocaleDateString()}`;
  h+=`<div class="sec srsline"><span>${stTxt}</span><span style="flex:1"></span>${known(w)?`<button class="btn" data-rate="u">撤销，放回闪卡</button>`:`<button class="btn" data-rate="1">不认识</button><button class="btn" data-rate="3">认识</button><button class="btn" data-rate="0">早就会了</button>`}</div>`;

$('#dlg').addEventListener('click',e=>{

});

/* ---------- flashcards ---------- */
let session=null;
function fillSelect(sel,withDue){
  const opts=(withDue?[['due','⏰ 今天该复习的']]:[]).concat([['key','⭐ 考试重点：观点、态度、程度、描述、连接词、短语'],['all','📚 全部词汇']],Object.entries(THEMES).map(([k,v])=>[k,v[0]+' '+v[1]]));
  sel.innerHTML=opts.map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
}
function deckIdle(){
  const d=W.filter(due).length;
  $('#deckStat').textContent=`今天到期 ${d} 个，还没背 ${W.filter(w=>!st(w)).length} 个`;
  $('#stage').innerHTML=`<div class="done"><h2>${d?`有 ${d} 个词等着复习`:'选一个场景开始'}</h2><p class="hint">考前冲刺节奏：认识的词隔 1、2、4、7 天再出现，连续答对 3 次算掌握；不认识的词 10 分钟后就回来。<br>快捷键：空格翻面，1 不认识，2 模糊，3 认识，4 早就会了，P 朗读单词，E 朗读例句。</p></div>`;
}
function startDeck(){
  const t=$('#deckTheme').value, n=+$('#deckSize').value;
  const pool=t==='due'?W:themeWords(t);
  const dueW=pool.filter(due).sort((a,b)=>st(a).d-st(b).d);
  let fresh=t==='due'?[]:shuffle(pool.filter(w=>!st(w)));
  if(t==='all') fresh.sort((a,b)=>(KEYT.includes(b.t)?1:0)-(KEYT.includes(a.t)?1:0));
  fresh=fresh.slice(0,n);
  const q=dueW.concat(fresh);
  if(!q.length){$('#stage').innerHTML=`<div class="done"><h2>这一组今天没有要背的了</h2><p class="hint">换一个场景，或者明天再来。</p></div>`;return;}
  session={q,pos:0,done:0,total:q.length,again:0}; drawCard();
}
function drawCard(){
  if(!session)return;
  if(session.pos>=session.q.length){ $('#stage').innerHTML=`<div class="done"><h2>这一轮完成了</h2><p class="hint">共 ${session.total} 个词，${session.known||0} 个标成了“早就会了”，${session.again} 次按了“不认识”。这些词 10 分钟后会再次到期。</p><button class="btn pri" onclick="startDeck()">再来一轮</button></div>`; session=null; refreshDeckStat(); return;}
  const w=session.q[session.pos];
  $('#stage').innerHTML=`<div style="width:100%;display:grid;justify-items:center">
  <div class="card" id="card" tabindex="0" role="button" aria-label="翻面">
    <div class="meta"><span>${THEMES[w.t][0]} ${THEMES[w.t][1]}</span><span>${session.pos+1} / ${session.q.length}</span></div>
    <div class="head">${w.e?`<div class="ce" aria-hidden="true">${w.e}</div>`:''}<div class="cw en">${esc(w.w)}</div>
      <div class="sub"><span class="backonly">${ipaHTML(w)}</span><button class="say" data-say="${esc(w.w)}" aria-label="朗读单词">🔊</button></div>
      <div class="tap">点击卡片或按空格翻面</div></div>
    <div class="back">
      <div class="mean">${posHTML(w)}</div>
      ${w.xs?`<div class="exbox">${exLine(w,true)}</div>`:''}
      ${w.mn?`<p class="extra"><b>联想记忆</b>${esc(w.mn)}</p>`:''}
      ${w.n?`<p class="extra"><b>备注</b>${esc(w.n)}</p>`:''}
    </div>
  </div>
  <div class="rate" id="rate" hidden><button class="r1" data-r="1">不认识<small>10 分钟后再来</small></button><button data-r="2">模糊<small>缩短间隔</small></button><button class="r3" data-r="3">认识<small>${IV[Math.min((st(w)?.b||0)+1,IV.length-1)]} 天后</small></button></div>
  <div class="rate"><button class="r0" data-r="0">早就会了<small>不再出现（键 4）</small></button></div>
  <p class="hint" id="cardHint">先在心里说出意思，再点卡片翻面。一眼就认识的词，直接按“早就会了”</p></div>`;
  $('#card').onclick=e=>{if(e.target.closest('[data-say]'))return; flip();};
}
function flip(){const c=$('#card'); if(!c)return; c.classList.toggle('flip'); $('#rate').hidden=false; $('#cardHint').textContent='';}
$('#stage').addEventListener('click',e=>{const b=e.target.closest('[data-r]'); if(b)answer(+b.dataset.r);});
function answer(r){
  const w=session.q[session.pos];
  if(r===0){session.known=(session.known||0)+1; markKnown(w); session.pos++; drawCard(); renderThemes(); return;}
  rate(w,r);
  if(r===1){session.again++; session.q.splice(Math.min(session.pos+6,session.q.length),0,w);}
  session.pos++; drawCard(); renderThemes();
}
function refreshDeckStat(){ $('#deckStat').textContent=`今天到期 ${W.filter(due).length} 个，还没背 ${W.filter(w=>!st(w)).length} 个`; }
$('#deckStart').onclick=startDeck;
document.addEventListener('keydown',e=>{
  if(!$('#v-cards').classList.contains('on')||!session||$('#dlg').open||e.target.matches('input,select'))return;
  const c=$('#card'); if(!c)return;
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.key==='p'||e.key==='P'){say(session.q[session.pos].w);}
  else if((e.key==='e'||e.key==='E')&&session.q[session.pos].xs){say(session.q[session.pos].xs);}
  else if(['1','2','3'].includes(e.key)&&!$('#rate').hidden){answer(+e.key);}
  else if(e.key==='4'){answer(0);}
});

/* ---------- quiz ---------- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
let quiz=null;
function startQuiz(){
  const t=$('#quizTheme').value, type=$('#quizType').value;
  let pool=t==='due'?W.filter(due):themeWords(t);
  if(type==='spell')pool=pool.filter(w=>!/[ \-]/.test(w.w));
  if(pool.length<4){$('#qbox').innerHTML='<p class="intro">这个范围的词太少，换一个范围吧。</p>';return;}
  quiz={type,items:shuffle(pool).slice(0,10),pos:0,score:0,wrong:[],pool};
  drawQ();
}
function drawQ(){
  const z=quiz; if(z.pos>=z.items.length)return quizEnd();
  const w=z.items[z.pos]; z.locked=false;
  let h=`<div class="qprog"><i style="width:${z.pos/z.items.length*100}%"></i></div>`;
  if(z.type==='spell'){
    h+=`<div class="qq"><div style="font-size:15px;color:var(--muted)">听发音，写出单词</div><button class="say" data-say="${esc(w.w)}" style="width:64px;height:64px;font-size:28px;margin:12px 0" aria-label="播放发音">🔊</button><div class="zh">${esc(shortM(w))}</div></div>
      <div class="spell"><input id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="拼写"><button class="btn pri" id="spellGo">检查</button></div>`;
  } else {
    const others=shuffle((z.pool.length>=8?z.pool:W).filter(x=>x!==w&&shortM(x)!==shortM(w))).slice(0,3);
    const opts=shuffle([w,...others]); z.opts=opts;
    h+=z.type==='en'?`<div class="qq"><div class="w en">${esc(w.w)} <button class="say" data-say="${esc(w.w)}" aria-label="朗读">🔊</button></div></div>`:`<div class="qq"><div class="zh">${esc(shortM(w))}</div></div>`;
    h+=`<div class="opts">${opts.map((o,i)=>`<button class="opt ${z.type==='zh'?'en':''}" data-o="${i}">${esc(z.type==='en'?shortM(o):o.w)}</button>`).join('')}</div>`;
  }
  h+=`<div class="fb" id="fb"></div>`;
  $('#qbox').innerHTML=h;
  if(z.type==='spell'){setTimeout(()=>say(w.w),250); const inp=$('#spellIn'); inp.focus(); inp.onkeydown=e=>{if(e.key==='Enter')checkSpell();}; $('#spellGo').onclick=checkSpell;}
  else if(z.type==='en') setTimeout(()=>say(w.w),250);
}
function qResult(ok){
  const z=quiz,w=z.items[z.pos]; z.locked=true;
  if(ok)z.score++; else {z.wrong.push(w); rate(w,1);}
  $('#fb').innerHTML=`<p class="${ok?'ok':'no'}">${ok?'答对了':'正确答案：'} <b class="en">${esc(w.w)}</b> ${ipaHTML(w)}</p><div class="mean" style="justify-content:center">${posHTML(w)}</div><div style="max-width:560px;margin:8px auto 14px;text-align:left">${exLine(w,true)}</div><button class="btn pri" id="nextQ">${z.pos+1<z.items.length?'下一题':'看结果'}</button>`;
  $('#nextQ').onclick=()=>{z.pos++;drawQ();}; $('#nextQ').focus();
}
function checkSpell(){ if(quiz.locked)return; const v=$('#spellIn').value.trim().toLowerCase(); const w=quiz.items[quiz.pos]; $('#spellIn').disabled=true; qResult(v===w.w.toLowerCase()); }
$('#qbox').addEventListener('click',e=>{const b=e.target.closest('.opt'); if(!b||quiz.locked)return;
  const w=quiz.items[quiz.pos], o=quiz.opts[+b.dataset.o], ok=o===w;
  $$('.opt').forEach((x,i)=>{x.disabled=true; if(quiz.opts[i]===w)x.classList.add('right');}); if(!ok)b.classList.add('wrong'); qResult(ok);});
function quizEnd(){
  const z=quiz;
  $('#qbox').innerHTML=`<div class="done" style="margin:0 auto"><h2>${z.score} / ${z.items.length}</h2><p class="hint">${z.wrong.length?'答错的词已经放进闪卡，10 分钟后到期：':'全对，换个题型再测一次？'}</p>
   ${z.wrong.length?`<div class="wlinks" style="justify-content:center">${z.wrong.map(w=>`<button class="wl" data-open="${w.i}">${esc(w.w)}</button>`).join('')}</div>`:''}
   <p style="margin-top:18px"><button class="btn pri" onclick="startQuiz()">再测 10 道</button></p></div>`;
  renderThemes();
}
$('#qbox').addEventListener('click',e=>{const o=e.target.closest('[data-open]'); if(o)openWord(W[o.dataset.open]);});
$('#quizStart').onclick=startQuiz;

/* ---------- links ---------- */
let linkTab='groups';
$$('.subnav .chip').forEach(c=>c.onclick=()=>{linkTab=c.dataset.l; $$('.subnav .chip').forEach(x=>x.setAttribute('aria-pressed',x===c)); renderLinks();});
function renderLinks(){
  let h='';
  if(linkTab==='groups'){
    h='<p class="intro">意思相近的词放在一起记，一次记住一串。CELPIP 口语和写作里换着用这些词，能避免重复。灰色虚线框是表里没有、但值得顺带认识的词。</p><div class="groups">'+
      DATA.groups.map(g=>`<div class="grp"><h3>${esc(g[0])}</h3><div class="wlinks">${g[1].map(n=>wlink(n)).join('')}</div>${g[2]?`<p>${esc(g[2])}</p>`:''}</div>`).join('')+'</div>';
  } else if(linkTab==='confuse'){
    h='<p class="intro">长得像、读音像或意思容易混的词。重点看每组下面的区分方法。</p><div class="groups">'+
      DATA.confuse.map(c=>`<div class="grp"><div class="wlinks">${c[0].map(n=>wlink(n)).join('')}</div><p style="color:var(--ink);font-size:14px">${esc(c[1])}</p></div>`).join('')+'</div>';
  } else {
    h='<p class="intro">认识一个词根，就能猜出一串词。点开单词可以看到更细的拆解。</p><div class="groups">'+
      DATA.roots.map(r=>`<div class="grp"><h3><span class="r">${esc(r[0])}</span>${esc(r[1])}</h3><div class="wlinks">${r[2].map(n=>wlink(n)).join('')}</div></div>`).join('')+'</div>';
  }
  $('#linkBody').innerHTML=h;
}
$('#linkBody').addEventListener('click',e=>{const o=e.target.closest('[data-open]'); if(o)openWord(W[o.dataset.open]);});

/* ---------- essays ---------- */
let essaysDone=false;
function renderEssays(){
  if(essaysDone)return; essaysDone=true;
  const forms=[]; W.forEach(w=>(w.ex||[]).forEach(x=>forms.push([x.f,w.i])));
  const uniq=[...new Map(forms.map(f=>[f[0],f])).values()].sort((a,b)=>b[0].length-a[0].length);
  const re=new RegExp('(?<![A-Za-z])('+uniq.map(f=>f[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z])','gi');
  const map=Object.fromEntries(uniq.map(f=>[f[0],f[1]]));
  $('#essayBody').innerHTML=DATA.essays.map((e,ei)=>{
    let n=0; const tx=esc(e.text).replace(re,m=>{const i=map[m.toLowerCase()]; if(i==null)return m; n++; return `<button data-open="${i}">${m}</button>`;});
    return `<details class="essay"${ei===0?' open':''}><summary>${esc(e.title)}<span>${n} 个词表词</span></summary><div class="tx">${tx}</div></details>`;}).join('');
}
$('#essayBody').addEventListener('click',e=>{const o=e.target.closest('[data-open]'); if(o)openWord(W[o.dataset.open]);});

/* ---------- progress ---------- */
function renderProgress(){
  const m=W.filter(mastered).length,l=W.filter(learning).length;
  $('#totals').innerHTML=`<div><b>${m}</b>已掌握</div><div><b>${W.filter(known).length}</b>其中早就会了</div><div><b>${l}</b>学习中</div><div><b>${W.length-m-l}</b>还没背</div><div><b>${W.filter(due).length}</b>今天该复习</div>`;
  $('#progGrid').innerHTML=Object.entries(THEMES).map(([k,v])=>{const ws=themeWords(k),a=ws.filter(mastered).length,b=ws.filter(learning).length;
    return `<div class="pt"><div class="h"><span>${v[0]} ${v[1]}</span><span>${a} / ${ws.length}</span></div><div class="stack"><i style="width:${a/ws.length*100}%"></i><i style="width:${b/ws.length*100}%"></i></div></div>`}).join('');
}
$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='celpip-progress.json'; a.click();};
$('#importFile').onchange=e=>{const f=e.target.files[0]; if(!f)return; f.text().then(t=>{try{const o=JSON.parse(t); if(typeof o!=='object')throw 0; const now=Date.now(); for(const k in o){ if(o[k]&&typeof o[k]==='object') o[k].u=now; } S=Object.assign({},S,o); save(); rerenderAll(); alert('进度已导入');}catch(_){alert('这个文件不是导出的进度文件');}});};
$('#resetBtn').onclick=()=>{if(confirm('清空全部背诵进度？登录状态下，其他设备上的进度也会一起清空。这一步不能撤销。')){S={};META.r=Date.now();save();rerenderAll();}};

/* ---------- bridge for cloud sync ---------- */
function rerenderAll(){ renderThemes(); renderList(); refreshMeter(); if($('#v-progress').classList.contains('on'))renderProgress(); if(!session&&$('#v-cards').classList.contains('on'))deckIdle(); }
window.__app={
  get:()=>({p:S,r:META.r||0}),
  owner:()=>META.owner, setOwner:(id)=>{META.owner=id; persist();},
  replace:(p,r)=>{S=p; META.r=r||0; persist(); rerenderAll();},
  clearLocal:()=>{S={}; META={r:0,owner:null}; persist(); rerenderAll();}
};
/* ---------- init ---------- */
$('#tcount').textContent=W.length; $('#srcSel').value=SRC;

fillSelect($('#deckTheme'),true); fillSelect($('#quizTheme'),true); $('#quizTheme').value='all';
if(!W.some(due)) $('#deckTheme').value='key';
renderThemes(); renderList(true); refreshMeter();
</script>
<script type="module">
// ---------- 云端同步：Firebase（Google 登录 + Firestore） ----------
const acct=document.getElementById('acct');
let cfg=null;
try{ cfg=(await import('./firebase-config.js')).firebaseConfig; }catch(e){ cfg=null; }
if(!cfg||!cfg.apiKey||/YOUR_/.test(cfg.apiKey)||location.protocol==='file:'){
  // 没有配置 Firebase，或者是直接双击打开的本地文件：只用本机进度
  if(location.protocol!=='file:'&&acct){acct.hidden=false; acct.innerHTML='<span class="dot"></span><span>未配置云同步</span>';}
} else {
  const V='10.12.2';
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const {getFirestore,doc,onSnapshot,runTransaction,serverTimestamp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app=initializeApp(cfg), auth=getAuth(app), db=getFirestore(app);
  const A=window.__app;
  let user=null, ref=null, unsub=null, timer=null, busy=false, again=false, state='idle';

  // 按单词合并：每个词保留更新时间（u）较新的那份；“清空进度”之前的记录丢掉
  function merge(a,b){
    const r=Math.max(a.r||0,b.r||0), p={};
    for(const src of [a.p||{},b.p||{}]) for(const k in src){
      const v=src[k]; if(!v||(v.u||0)<=r) continue;
      if(!p[k]||(v.u||0)>(p[k].u||0)) p[k]=v;
    }
    return {p,r};
  }
  const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);

  function render(){
    acct.hidden=false;
    if(!user){ acct.innerHTML='<button class="pri" id="loginBtn">用 Google 登录同步</button>';
      document.getElementById('loginBtn').onclick=login; return; }
    const lab={idle:'已同步',busy:'同步中…',off:'离线，联网后自动同步',err:'同步失败，稍后重试'}[state];
    const cls={idle:'ok',busy:'busy',off:'off',err:'off'}[state];
    acct.innerHTML=`${user.photoURL?`<img src="${user.photoURL}" alt="" referrerpolicy="no-referrer">`:''}<span class="who"></span><span class="dot ${cls}" title="${lab}"></span><span class="st">${lab}</span><button id="logoutBtn">退出</button>`;
    const who=acct.querySelector('.who'); who.textContent=user.displayName||user.email||''; who.title=user.email||'';
    document.getElementById('logoutBtn').onclick=logout;
  }
  function setState(s){ state=s; render(); }

  async function login(){
    const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    try{ await signInWithPopup(auth,p); }
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') await signInWithRedirect(auth,p);
      else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') alert('登录失败：'+e.code);
    }
  }
  async function logout(){
    if(!confirm('退出后，这台设备上的进度会清除（云端还在，下次登录会恢复）。确定退出？'))return;
    await flush(); if(unsub){unsub();unsub=null;} ref=null; await signOut(auth); A.clearLocal();
  }

  // 本机进度和云端合并后写回。用事务，避免两台设备同时写时互相覆盖
  async function push(){
    if(!ref)return;
    if(busy){again=true;return;}
    if(!navigator.onLine){setState('off');return;}
    busy=true; setState('busy');
    try{
      let merged;
      await runTransaction(db,async tx=>{
        const snap=await tx.get(ref);
        const cloud=snap.exists()?snap.data():{p:{},r:0};
        merged=merge(cloud,A.get());
        if(!snap.exists()||!same({p:cloud.p||{},r:cloud.r||0},merged))
          tx.set(ref,{p:merged.p,r:merged.r,updatedAt:serverTimestamp()});
      });
      // 写入期间如果又背了新词，再合并一次，不丢本机最新记录
      const now=merge(merged,A.get());
      if(!same(now,A.get())) A.replace(now.p,now.r);
      if(!same(now,merged)) again=true;
      setState('idle');
    }catch(e){ console.warn('sync',e); setState(navigator.onLine?'err':'off'); clearTimeout(timer); timer=setTimeout(push,15000); }
    busy=false; if(again){again=false; push();}
  }
  async function flush(){ if(timer){clearTimeout(timer);timer=null;} await push(); }
  window.__sync={schedule(){ if(!ref)return; clearTimeout(timer); timer=setTimeout(push,2500); }};
  addEventListener('online',()=>push());
  addEventListener('offline',()=>{ if(ref) setState('off'); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&timer) flush(); });

  onAuthStateChanged(auth,async u=>{
    user=u; if(unsub){unsub();unsub=null;} ref=null;
    if(!u){ render(); return; }
    // 这台设备上的进度属于另一个账号时先清掉，避免混进别人的进度
    if(A.owner()&&A.owner()!==u.uid) A.clearLocal();
    A.setOwner(u.uid);
    ref=doc(db,'users',u.uid);
    render(); await push();
    // 其他设备有更新时，实时合并进来
    unsub=onSnapshot(ref,snap=>{
      if(snap.metadata.hasPendingWrites||!snap.exists())return;
      const data=snap.data(), merged=merge(data,A.get());
      if(!same(merged,A.get())) A.replace(merged.p,merged.r);
      if(!same({p:data.p||{},r:data.r||0},merged)) window.__sync.schedule();
    },e=>console.warn('snapshot',e));
  });
  render();
}
</script>
